<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Job Application</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f8fb;
      margin: 0;
      padding: 0;
      color: #1f2937;
    }
    .container {
      max-width: 640px;
      margin: 32px auto;
      background: #ffffff;
      border-radius: 10px;
      padding: 28px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }
    h1 {
      font-size: 20px;
      margin: 0 0 16px;
      color: #111827;
    }
    p {
      line-height: 1.5;
      margin: 12px 0;
      color: #374151;
    }
    .button {
      display: inline-block;
      padding: 12px 18px;
      margin-top: 18px;
      background: #0f8cff;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>New applicant for {{job_title}}</h1>
    <p>Hi {{pm_name}},</p>
    <p><strong>{{engineer_name}}</strong> just applied to your role at {{company}}.</p>
    <p>You can view the applicant details and move them forward from the dashboard.</p>
    <a class="button" href="{{application_url}}" target="_blank">View applicants</a>
    <p class="footer">You are receiving this email because you created this job on Stechad.</p>
  </div>
</body>
</html>
